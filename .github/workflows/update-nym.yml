name: Update Nym VPN

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-nym-vpn
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update pinned upstream assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command ./scripts/update-sources.sh

      - name: Check flake
        run: nix flake check -L

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- sources.json flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          app_version="$(jq -r '.app.version' sources.json)"
          daemon_version="$(jq -r '.daemon.version' sources.json)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json flake.lock
          git commit -m "Update Nym VPN app ${app_version} and daemon ${daemon_version}"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
